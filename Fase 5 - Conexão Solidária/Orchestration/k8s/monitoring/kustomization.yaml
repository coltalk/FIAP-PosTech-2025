apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus.yaml
  - grafana.yaml

# Arquivos de configuracao viram ConfigMaps — sem copiar YAML/JSON para dentro de YAML.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasources
    files:
      - grafana/datasource.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/conexao-solidaria.json
