# stringData: o Kubernetes converte para base64 ao aplicar.
# Valores de desenvolvimento — em producao viriam de um cofre (Key Vault, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: campanhas-api-secret
type: Opaque
stringData:
  ConnectionStrings__Campanhas: "Host=postgres;Database=campanhas;Username=dev;Password=dev"
  RabbitMQ__Password: "dev"
  Jwt__Key: "k8s-dev-key-troque-em-producao-0123456789abcdef"
  Seed__Gestor__Senha: "Gestor@123"
