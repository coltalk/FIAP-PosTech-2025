apiVersion: apps/v1
kind: Deployment
metadata:
  name: doacoes-worker
  labels:
    app: doacoes-worker
spec:
  replicas: 1          # pode subir para 2+ quando a fila acumular: o ledger garante idempotencia
  selector:
    matchLabels:
      app: doacoes-worker
  template:
    metadata:
      labels:
        app: doacoes-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: espera-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo aguardando mongo; sleep 2; done"]
        - name: espera-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo aguardando rabbitmq; sleep 2; done"]
      containers:
        - name: doacoes-worker
          image: ghcr.io/pablosdlima/conexaosolidaria/doacoes-worker:latest   # publicada pelo CI; deploy-local.sh troca pela imagem local
          imagePullPolicy: Always          # latest do GHCR: sempre buscar a versao publicada pelo CI
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: doacoes-worker-config
            - secretRef:
                name: doacoes-worker-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
