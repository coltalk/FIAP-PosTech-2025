services:
  tcuser-api:
    build:
      context: .
      dockerfile: TcUser.Api/Dockerfile
    image: tcuser-img
    container_name: tcuser-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__DefaultConnection: Server=host.docker.internal,1433;Database=TcUserDb;User Id=sa;Password=Jl130916;Encrypt=False;TrustServerCertificate=True;
      RabbitMq__HostName: host.docker.internal
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      RabbitMq__UserCreatedQueue: UserCreated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5002"

