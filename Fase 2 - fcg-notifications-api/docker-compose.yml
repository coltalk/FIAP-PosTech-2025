services:
  notifications-api:
    image: notifications-img
    build:
      context: .
      dockerfile: Notifications.Api/Dockerfile
    container_name: fcg-notifications-api
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=host.docker.internal
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__PaymentProcessedExchange=PaymentProcessed
      - RabbitMQ__PaymentProcessedQueue=PaymentProcessed.Notifications
